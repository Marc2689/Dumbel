<title>Dumbel</title>
<style>
:root{--bg:#0b0b0f;--card:#15151c;--card2:#20202a;--txt:#f5f2f5;--mut:#a39aa3;--acc:#ff4fa3;--ok:#2ecc71;--bad:#e5484d;--line:#30303a;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:14px 14px calc(150px + var(--safe));max-width:640px;margin:0 auto}
h1{font-size:26px;margin:6px 0 14px}h2{font-size:17px;margin:20px 0 8px;color:var(--mut);font-weight:600}
.muted{color:var(--mut)}.sm{font-size:13px}
input,select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
button{font:inherit;color:var(--txt);background:var(--card2);border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
button:active{opacity:.7}
.btn{font-weight:600}.btn.big{width:100%;padding:14px;margin:8px 0;background:var(--acc);color:#fff}
.btn.sm{padding:8px 12px;font-size:14px}.btn.acc{background:var(--acc);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.card{background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row-b>div{min-width:0}
.title{font-size:20px;font-weight:700;background:transparent;border:0;padding:6px 0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.stats3>div{background:var(--card);border-radius:12px;padding:8px 10px}
.stats3 small{display:block;color:var(--mut);font-size:12px}.stats3 b{font-size:17px}
.exh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.exh .nm{flex:1;font-weight:700;color:var(--acc);min-width:0}
.exh button{padding:4px 9px;background:transparent;color:var(--mut)}
.srow{display:grid;gap:6px;align-items:center;margin:5px 0}
.srow.head{font-size:12px;color:var(--mut);text-align:center}
.srow .sn{text-align:center;color:var(--mut);font-weight:600}
.srow button.sn{background:var(--card2);padding:8px 0;color:var(--txt);font-weight:700}
.t-warmup{color:#ffb020!important}.t-failure{color:var(--bad)!important}.t-drop{color:#4aa8ff!important}
.srow input{text-align:center;padding:9px 4px}
.srow .prev{background:transparent;color:var(--mut);padding:6px 2px;font-size:14px}
.srow .chk{padding:8px 0;background:var(--card2);color:var(--mut)}
.srow.done{background:rgba(46,204,113,.12);border-radius:10px}
.srow.done .chk{background:var(--ok);color:#fff}
.srow .del{background:transparent;color:var(--mut);padding:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe);z-index:5}
nav button{flex:1;background:transparent;border-radius:0;padding:9px 0 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:var(--acc)}
#rest{position:fixed;left:10px;right:10px;bottom:calc(62px + var(--safe));background:var(--card2);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;z-index:6;box-shadow:0 4px 18px rgba(0,0,0,.5);overflow:hidden}
#rest[hidden]{display:none}
#rest .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,107,53,.25);width:0;transition:width 1s linear}
#rest>*{position:relative}#rest #resttime{font-size:22px;font-weight:700;flex:1}
#sheet,#sheet2{position:fixed;inset:0;z-index:20;display:none}#sheet2{z-index:30}
#sheet.on,#sheet2.on{display:block}
.back{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 14px calc(20px + var(--safe));max-width:640px;margin:0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{white-space:nowrap;padding:6px 12px;border-radius:99px;font-size:14px;background:var(--card2);color:var(--mut)}
.chip.on{background:var(--acc);color:#fff}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);gap:8px}
.li.sel{background:rgba(255,107,53,.15)}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{background:var(--acc);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{background:var(--card);border-radius:12px;padding:10px}.kv small{display:block;color:var(--mut);font-size:12px}.kv b{font-size:18px}
svg.chart{width:100%;height:auto;display:block}
#dialog{position:fixed;inset:0;z-index:80;background:#000b;display:flex;align-items:center;justify-content:center;padding:22px}#dialog[hidden]{display:none}#dialog .dialog-card{width:100%;max-width:420px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 40px #0008}#dialog .dialog-actions{display:flex;gap:8px;margin-top:16px}#dialog .dialog-actions button{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + var(--safe));background:#000c;padding:10px 16px;border-radius:99px;z-index:50;display:none;font-size:14px}
label.lb{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.pr{color:#ffd23f;font-weight:600}
.plink{cursor:pointer;text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:3px}
.exrest{margin:0 0 6px}.exrest button{padding:4px 12px}
.animal{text-align:center;background:var(--card);border-radius:14px;padding:14px;margin:12px 0}.animal .big{font-size:76px;line-height:1.15}
.how{margin:0;padding-left:20px}.how li{margin:6px 0}
.tip{margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(255,107,53,.12);font-size:14px}
.pname{font-weight:700}.pitem{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:13px;color:var(--mut)}.pitem span:first-child{cursor:pointer;text-decoration:underline dotted}
h2 .sm{font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:12px;color:var(--mut);padding:2px 0}
.cd{aspect-ratio:1;border-radius:10px;background:var(--card);padding:0;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid transparent;color:var(--txt)}
.cd.blank{background:transparent;pointer-events:none}
.cd.has{background:rgba(255,107,53,.22);font-weight:700}
.cd.today{border-color:var(--mut)}
.cd.sel{outline:2px solid var(--acc);outline-offset:0}
.cd .dots{display:flex;gap:2px;height:5px}.cd .dots i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.calnav b{font-size:18px}.calnav button{padding:8px 14px}.calnav button[disabled]{opacity:.3}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--mut);margin-left:6px}
body.light{--bg:#f5f3f6;--card:#fff;--card2:#ece8ee;--txt:#211b23;--mut:#746b76;--line:#ddd5df;--acc:#d92f83;--ok:#218c55;--bad:#c8323b}
body.light nav{background:#fff}
textarea{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;width:100%;min-width:0;resize:vertical}
.note-field{margin:8px 0}
#pr{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:22px;overflow:hidden}#pr[hidden]{display:none}
#pr .pr-card{position:relative;width:100%;max-width:360px;text-align:center;background:var(--card);border:2px solid #ffd23f;border-radius:20px;padding:24px 18px;box-shadow:0 0 40px rgba(255,210,63,.35);animation:prpop .5s cubic-bezier(.2,1.6,.4,1)}
#pr .trophy{font-size:72px;line-height:1.1;animation:prbounce 1s ease-in-out infinite}
#pr h2{color:#ffd23f;font-size:22px;margin:6px 0}
#pr .conf{position:absolute;top:-30px;font-size:22px;animation:prfall linear forwards;pointer-events:none}
@keyframes prpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes prbounce{50%{transform:scale(1.15) rotate(-6deg)}}
@keyframes prfall{to{transform:translateY(110vh) rotate(360deg)}}
.wed{display:grid;gap:6px;align-items:center;margin:5px 0}
#rot{display:none}
@media (orientation:landscape) and (max-height:560px){#rot{position:fixed;inset:0;z-index:999;background:var(--bg);color:var(--txt);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:18px;text-align:center}#rot span{font-size:48px}}

const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
function seedExercises(){const out=[];let m='Other';
  SEED.split('\n').forEach(l=>{l=l.trim();if(!l)return;
    if(l[0]==='#'){m=l.slice(1).trim();return}
    const [name,type]=l.split('|');out.push({id:'s_'+slug(name),name,muscle:m,type:type||'wr',custom:false})});
  return out}

/* ---------- state ---------- */
const APP_VERSION='27'; /* keep in sync with CACHE in sw.js ('dumbel-v27') */
const KEY='ironlog.v1'; /* unchanged on purpose so existing saved data keeps loading */
const defaultBars=()=>[{id:'b_oly',name:'Olympic bar',kg:20,lb:45},{id:'b_wom',name:"Women's bar",kg:15,lb:35},{id:'b_ez',name:'EZ curl bar',kg:10,lb:25},{id:'b_smith',name:'Smith machine bar',kg:15,lb:35},{id:'b_none',name:'No bar / machine',kg:0,lb:0}];
const fresh=()=>({exercises:seedExercises(),routines:[],workouts:[],active:null,settings:{unit:'kg',rest:90},restByEx:{},bars:defaultBars(),barByEx:{}});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.exercises)&&Array.isArray(d.workouts)){d.routines=d.routines||[];d.restByEx=d.restByEx||{};d.bars=Array.isArray(d.bars)&&d.bars.length?d.bars:defaultBars();d.barByEx=d.barByEx||{};d.settings=Object.assign({unit:'kg',rest:90},d.settings);return d}}catch(e){}return fresh()}
let S=load();
function exerciseKey(n){return String(n||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim().replace(/ +/g,' ')}
function sameExercise(a,b){
 const clean=x=>exerciseKey(x).split(' ').filter(w=>w!=='the');
 const x=clean(a),y=clean(b);if(x.join(' ')===y.join(' '))return true;
 if(!x.length||!y.length)return false;
 return x.filter(w=>y.includes(w)).length/Math.max(x.length,y.length)>=.9;
}
function cleanExerciseDuplicates(){
 const all=S.exercises||[],removed=new Map();
 for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
  const a=all[i],b=all[j];if(removed.has(a.id)||removed.has(b.id)||!sameExercise(a.name,b.name))continue;
  const ac=String(a.id).startsWith('h_'),bc=String(b.id).startsWith('h_');
  const keep=ac&&!bc?a:bc&&!ac?b:a.custom&&!b.custom?a:!a.custom&&b.custom?b:a;
  removed.set(keep===a?b.id:a.id,keep.id);
 }
 if(!removed.size)return;
 const resolve=id=>{while(removed.has(id))id=removed.get(id);return id};
 S.exercises=all.filter(e=>!removed.has(e.id));
 [...(S.workouts||[]),...(S.routines||[]),...(S.active?[S.active]:[])].forEach(w=>(w.items||[]).forEach(i=>i.exId=resolve(i.exId)));
 save();
}
cleanExerciseDuplicates();
/* set types from imports (e.g. Hevy "dropset") are normalised to the ones the app knows */
const SET_TYPES_OK=['normal','warmup','failure','drop'];
const fixType=t=>t==null||SET_TYPES_OK.includes(t)?t:(/drop/i.test(t)?'drop':/warm/i.test(t)?'warmup':/fail/i.test(t)?'failure':'normal');
function fixSetTypes(){let ch=false;
 const fix=s=>{if(s&&s.t!=null&&!SET_TYPES_OK.includes(s.t)){s.t=fixType(s.t);if(s.t==='normal')delete s.t;ch=true}};
 [...(S.workouts||[]),...(S.active?[S.active]:[])].forEach(w=>(w.items||[]).forEach(i=>(i.sets||[]).forEach(fix)));
 (S.routines||[]).forEach(r=>(r.items||[]).forEach(i=>{if(Array.isArray(i.types)&&i.types.some(t=>!SET_TYPES_OK.includes(t))){i.types=i.types.map(t=>fixType(t)||'normal');ch=true}}));
 if(ch)save()}
fixSetTypes();
document.body.classList.toggle('light',S.settings.theme==='light');
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save — storage full?')}}

/* ---------- backups: auto-file (File System Access API) + share sheet ---------- */
const BK_KEY='dumbel.lastBackup';
const lastBackup=()=>{try{return +localStorage.getItem(BK_KEY)||0}catch(e){return 0}};
const markBackup=()=>{try{localStorage.setItem(BK_KEY,String(Date.now()))}catch(e){}};
const backupDue=()=>S.workouts.length>0&&Date.now()-lastBackup()>7*864e5;
const backupLabel=()=>{const t=lastBackup();if(!t)return 'never';const d=Math.floor((Date.now()-t)/864e5);return (d<1?'today':d===1?'yesterday':d+' days ago')+' ('+new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+')'};
const backupNudge=()=>backupDue()?`<div class="card" style="border-color:var(--bad)"><div class="row-b"><span>⚠️ ${lastBackup()?'Last backup was '+backupLabel()+'.':'You have never backed up.'} Your data only lives on this device.</span></div><button class="btn acc" style="width:100%;margin-top:8px" data-act="shareBackup">Back up now</button></div>`:'';
const canFS=!!(window.showSaveFilePicker&&window.indexedDB);
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('dumbel-backup',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');v==null?tx.objectStore('kv').delete(k):tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
let bkHandle=null,bkName='';
if(canFS)idbGet('handle').then(h=>{if(h){bkHandle=h;bkName=h.name;if(ui&&ui.tab==='stats')render()}}).catch(()=>{});
const backupJson=()=>JSON.stringify(S,null,1);
const backupFileName=()=>`dumbel-backup-${new Date().toISOString().slice(0,10)}.json`;
/* write to the linked file; needs permission, which can only be re-requested from a tap (so call from a click handler) */
async function writeLinked(interactive){
  if(!bkHandle)return false;
  try{
    let p=await bkHandle.queryPermission({mode:'readwrite'});
    if(p!=='granted'&&interactive)p=await bkHandle.requestPermission({mode:'readwrite'});
    if(p!=='granted')return false;
    const w=await bkHandle.createWritable();await w.write(backupJson());await w.close();markBackup();return true;
  }catch(e){return false}}
/* ---------- how-to instructions (built-in exercises) ---------- */
const INFOTXT=`@Bench Press (Barbell)
Lie on the bench with eyes under the bar, feet flat, shoulder blades pinched together and down.
Grip the bar slightly wider than shoulder width and unrack it over your shoulders.
Lower the bar under control to your mid-chest, elbows about 45–70° from your torso.
Press up and slightly back until your arms are straight.
! Keep your glutes on the bench and use a spotter or safety arms for heavy sets.
@Incline Bench Press (Barbell)
Set the bench to 30–45° and lie back with feet planted and shoulder blades tucked.
Unrack with a shoulder-width-plus grip and hold the bar over your upper chest.
Lower to your upper chest with control.
Press back up until your arms lock out.
! A steeper angle shifts work to the shoulders — 30° is usually the sweet spot.
@Decline Bench Press (Barbell)
Secure your legs on a decline bench and lie back with the bar over your lower chest.
Unrack and lower the bar to your lower chest.
Press up to full arm extension.
! Use a spotter; it's harder to bail out of a heavy decline rep.
@Bench Press (Dumbbell)
Sit with dumbbells on your thighs, then lie back and kick them up to chest height.
Start with arms straight above your chest, palms facing forward.
Lower until your upper arms are just below parallel with the bench.
Press back up, bringing the dumbbells together without clanging them.
! Dumbbells allow a bigger stretch than a bar — control the bottom position.
@Incline Bench Press (Dumbbell)
Set the bench to 30–45° and sit back with the dumbbells at your shoulders.
Press them up until your arms are straight above your upper chest.
Lower slowly until you feel a stretch across your chest.
! Keep wrists stacked over elbows throughout.
@Chest Press (Machine)
Adjust the seat so the handles line up with the middle of your chest.
Sit back with your shoulder blades against the pad and grip the handles.
Press forward until your arms are almost straight.
Return slowly until you feel a stretch, without letting the stack touch down.
! Don't let your shoulders roll forward at the end of each rep.
@Chest Fly (Dumbbell)
Lie on a flat bench with dumbbells above your chest, palms facing each other and a slight bend in the elbows.
Open your arms in a wide arc until you feel a deep chest stretch.
Squeeze the dumbbells back together over your chest along the same arc.
! Keep the elbow bend fixed — if it straightens and bends, it turns into a press.
@Chest Fly (Machine)
Set the seat so the handles are at chest height.
Sit back with your chest up and grip the handles with a slight elbow bend.
Bring the handles together in front of you and squeeze.
Return slowly to a comfortable stretch.
! Pause for a second at the squeeze for a better contraction.
@Cable Fly Crossovers
Set the pulleys high and stand in a split stance holding a handle in each hand.
Lean slightly forward with a slight elbow bend.
Sweep your hands down and together in front of your hips.
Return slowly until your chest is stretched.
! Move only at the shoulder — your elbows shouldn't bend more as you pull.
@Push Up
Start in a high plank, hands just wider than your shoulders, body in a straight line.
Lower your chest to just above the floor, elbows about 45° from your body.
Push the floor away until your arms are straight.
! Squeeze your glutes and abs so your hips don't sag. Drop to your knees if needed.
@Chest Dip
Grip the parallel bars and lift yourself with arms straight.
Lean your torso forward and let your legs hang or cross behind you.
Lower until your upper arms are about parallel to the floor.
Press back up to straight arms.
! Leaning forward targets the chest; staying upright targets the triceps.
@Deadlift (Barbell)
Stand with the bar over mid-foot, feet hip-width apart.
Hinge down and grip the bar just outside your legs. Chest up, back flat, shoulders over the bar.
Brace your core and push the floor away, keeping the bar against your legs.
Stand tall at the top, then lower by hinging at the hips first, then bending the knees.
! Never round your lower back. If it rounds, reduce the weight.
@Bent Over Row (Barbell)
Hold the bar with an overhand grip and hinge forward until your torso is about 45° with a flat back.
Let the bar hang below your knees with arms straight.
Row the bar to your lower ribs, driving your elbows back.
Lower with control.
! Don't use momentum — keep your torso angle fixed.
@Pull Up
Hang from a bar with an overhand grip a little wider than your shoulders.
Pull your shoulder blades down, then drive your elbows toward your hips.
Pull until your chin clears the bar.
Lower fully until your arms are straight.
! Avoid kipping. Use a band or negatives if you can't do full reps yet.
@Chin Up
Hang from the bar with an underhand, shoulder-width grip.
Pull yourself up until your chin is over the bar.
Lower under control to a full hang.
! Keep your chest up and think about pulling your elbows down to your sides.
@Lat Pulldown (Cable)
Sit with your thighs secured under the pads and grab the bar slightly wider than your shoulders.
Lean back a few degrees with your chest up.
Pull the bar to your upper chest, driving your elbows down.
Let the bar rise slowly until your arms are straight.
! Don't swing your torso or pull the bar behind your neck.
@Seated Cable Row - Bar Grip
Sit with your feet on the plates and knees slightly bent, holding the handle with arms extended.
Sit tall with your chest up.
Pull the handle to your lower stomach, squeezing your shoulder blades together.
Return slowly, letting your shoulders stretch forward slightly.
! Keep your torso mostly still; don't rock back to move the weight.
@Dumbbell Row
Place one knee and the same-side hand on a bench, other foot on the floor.
Hold a dumbbell with your free hand, arm hanging straight.
Row the dumbbell toward your hip, keeping your elbow close to your body.
Lower slowly to a full stretch.
! Keep your back flat and hips square — don't twist as you pull.
@T Bar Row
Straddle the bar, hinge forward with a flat back and grab the handle.
Pull the weight toward your chest, driving your elbows back.
Squeeze your shoulder blades together at the top.
Lower under control.
! Keep your head neutral — look at the floor a little ahead of you.
@Straight Arm Lat Pulldown (Cable)
Stand facing a high cable with a bar or rope, arms straight, slight hinge at the hips.
Keeping your arms nearly straight, sweep the bar down to your thighs.
Pause and feel your lats squeeze.
Return slowly overhead.
! Move from your shoulders, not your elbows.
@Back Extension (Hyperextension)
Set the pad at hip level on a back extension bench with feet secured.
Cross your arms and keep your body straight from head to heels.
Lower your torso by hinging at the hips.
Raise back up until your body is in a straight line.
! Stop at a straight line — leaning back past it just stresses the lower back.
@Overhead Press (Barbell)
Hold the bar at your collarbone with a grip just outside your shoulders.
Brace your core and squeeze your glutes.
Press the bar straight up, moving your head back slightly then through as it passes.
Lock out overhead, then lower back to your collarbone.
! Don't lean back — keep ribs down and glutes tight.
@Shoulder Press (Dumbbell)
Sit or stand with the dumbbells at shoulder height, palms facing forward.
Press up until your arms are straight above you.
Lower back to ear level under control.
! Keep your core tight so your lower back doesn't arch.
@Arnold Press (Dumbbell)
Start with dumbbells in front of your shoulders, palms facing you.
Press up while rotating your palms to face forward.
Finish with arms straight overhead.
Reverse the rotation as you lower.
! Use lighter weights than a normal press — the rotation makes it harder.
@Lateral Raise (Dumbbell)
Stand with a dumbbell in each hand at your sides and a slight elbow bend.
Raise your arms out to the sides until they're about shoulder height.
Lower slowly.
! Lead with your elbows and don't shrug. Light weight with strict form works best.
@Lateral Raise (Cable)
Stand side-on to a low cable and grab the handle with the far hand.
Raise your arm out to the side to shoulder height.
Lower slowly against the cable's tension.
! The cable keeps constant tension at the bottom, so don't rest between reps.
@Front Raise (Dumbbell)
Stand holding dumbbells in front of your thighs.
Raise one or both arms straight in front of you to shoulder height.
Lower under control.
! Don't swing your body — if you need to, the weight is too heavy.
@Rear Delt Reverse Fly (Dumbbell)
Hinge forward at the hips with a flat back, dumbbells hanging below your chest.
With a slight elbow bend, raise your arms out to the sides.
Squeeze your shoulder blades together at the top.
Lower slowly.
! Use light weights — the rear delts are small.
@Rear Delt Reverse Fly (Machine)
Sit facing the pad with your chest against it and grab the handles.
Pull the handles out and back in a wide arc, keeping your arms almost straight.
Squeeze your shoulder blades together.
Return slowly.
! Keep your shoulders down — don't shrug.
@Face Pull
Set a rope at upper-chest to face height.
Pull the rope toward your face, splitting the ends apart by your ears.
Squeeze your shoulder blades together and hold briefly.
Return slowly.
! Great for shoulder health. Use light weight and high reps.
@Upright Row (Barbell)
Hold a bar or dumbbells in front of your thighs with a shoulder-width grip.
Pull straight up along your body, leading with your elbows.
Stop around chest height.
Lower slowly.
! Keep the grip wide and don't lift elbows far above your shoulders if it pinches.
@Shrug (Dumbbell)
Stand holding dumbbells at your sides.
Lift your shoulders straight up toward your ears.
Hold for a second, then lower slowly.
! Don't roll your shoulders — just straight up and down.
@Shrug (Barbell)
Hold a barbell in front of your thighs with an overhand grip.
Shrug your shoulders straight up as high as you can.
Hold briefly, then lower slowly.
! Keep your arms straight — the movement comes from the traps, not the biceps.
@Bicep Curl (Barbell)
Stand holding a barbell with an underhand shoulder-width grip.
Keep your elbows pinned to your sides and curl the bar up to shoulder height.
Squeeze, then lower slowly to full arm extension.
! Don't swing your back to move the bar.
@Bicep Curl (Dumbbell)
Stand with a dumbbell in each hand, palms facing forward.
Curl the weights up while keeping your elbows by your sides.
Squeeze at the top and lower slowly.
! Alternate arms or do both together — either works.
@Hammer Curl (Dumbbell)
Hold dumbbells with palms facing each other.
Curl up without rotating your wrists, elbows tucked in.
Lower slowly.
! Hits the brachialis and forearms as well as the biceps.
@Preacher Curl (Barbell)
Sit at a preacher bench with your upper arms resting flat on the pad.
Curl the bar or dumbbells up toward your shoulders.
Lower slowly until your arms are almost straight.
! Don't fully lock out at the bottom with heavy weight — that stresses the elbow.
@Seated Incline Curl (Dumbbell)
Sit back on an incline bench (about 60°) with dumbbells hanging at your sides.
Curl up without moving your upper arms forward.
Lower slowly to a full stretch.
! The stretched position at the bottom is where this exercise shines.
@Bicep Curl (Cable)
Stand facing a low cable with a bar or rope attachment.
Curl the handle up, keeping your elbows by your sides.
Squeeze at the top and lower slowly.
! The cable keeps tension on the biceps through the whole rep.
@Concentration Curl
Sit on a bench with your elbow braced against your inner thigh.
Curl the dumbbell up toward your shoulder.
Squeeze, then lower under control.
! Slow and strict — don't lean back to help.
@Triceps Pushdown
Stand facing a high cable with a bar or rope, elbows pinned to your sides.
Push down until your arms are fully straight.
Return until your forearms are just past parallel with the floor.
! Don't let your elbows drift forward or flare out.
@Skullcrusher (Barbell)
Lie on a bench holding a bar (or EZ-bar) above your chest with straight arms.
Bend only your elbows to lower the bar toward your forehead or just behind your head.
Extend your arms back up.
! Keep your upper arms vertical and still. Use a spotter for heavier weights.
@Overhead Triceps Extension (Cable)
Hold a dumbbell or cable handle overhead with both hands, elbows pointing forward.
Lower the weight behind your head by bending your elbows.
Extend back up until your arms are straight.
! Keep your elbows close to your ears and your core tight.
@Bench Press - Close Grip (Barbell)
Lie on a bench and grip the bar about shoulder-width apart.
Lower the bar to your lower chest with your elbows tucked close.
Press up until your arms are straight.
! Don't go much narrower than shoulder width — it strains the wrists.
@Triceps Dip
Support yourself on parallel bars with straight arms, torso upright.
Lower until your upper arms are about parallel with the floor, elbows pointing back.
Press back up to straight arms.
! Staying upright keeps the focus on your triceps rather than your chest.
@Bench Dip
Sit on the edge of a bench with hands beside your hips, then slide your hips off the front.
Lower your body by bending your elbows to about 90°.
Press back up to straight arms.
! Keep your hips close to the bench. Bend your knees to make it easier.
@Triceps Kickback (Dumbbell)
Hinge forward with a flat back and your upper arm parallel to the floor, holding a dumbbell.
Extend your elbow to straighten your arm behind you.
Squeeze, then bring it back slowly.
! Keep your upper arm still — only your forearm moves.
@Squat (Barbell)
Set the bar on your upper back, feet shoulder-width apart, toes slightly out.
Brace your core, take a big breath, and sit down and back.
Lower until your thighs are at least parallel to the floor, knees tracking over your toes.
Drive up through your whole foot to stand tall.
! Keep your chest up and the bar over mid-foot. Use safety bars in a rack.
@Front Squat
Rest the bar on your front shoulders, elbows high, upper arms parallel to the floor.
Squat down while keeping your torso as upright as possible.
Drive up through your feet to stand.
! If the elbows drop, the bar rolls forward — keep them high.
@Leg Press (Machine)
Sit in the machine with your feet shoulder-width apart in the middle of the platform.
Release the safety and lower the platform until your knees are about 90°.
Press back up without locking your knees.
! Keep your lower back and hips flat against the seat the whole time.
@Leg Extension (Machine)
Sit in the machine with the pad on your lower shins and knees lined up with the pivot.
Extend your legs until they are straight.
Squeeze your quads, then lower slowly.
! Control the lowering — don't let the weight crash down.
@Hack Squat
Position your shoulders under the pads with feet shoulder-width on the platform.
Release the safety and lower until your knees reach about 90° or lower.
Drive back up without locking out.
! Placing your feet lower targets quads more; higher shifts work to glutes.
@Goblet Squat
Hold a dumbbell or kettlebell against your chest with both hands.
Squat down between your knees, keeping your chest up.
Stand back up by driving through your feet.
! A great way to learn the squat pattern. Use your elbows to push your knees out.
@Bulgarian Split Squat (Dumbbell)
Stand a stride in front of a bench and rest the top of your back foot on it.
Lower straight down until your front thigh is parallel to the floor.
Drive through your front heel to stand.
! Keep most of your weight on the front leg and your torso slightly forward.
@Lunge (Dumbbell)
Stand holding dumbbells at your sides.
Step forward and lower until both knees are around 90°.
Push off your front foot to return to the start.
! Keep your front knee above your ankle, and your torso upright.
@Walking Lunge
Take a big step forward and lower your back knee toward the floor.
Push through the front foot and bring your back leg through into the next step.
Continue alternating legs as you walk forward.
! Take long steps and keep your torso tall for better glute work.
@Step Up
Stand facing a bench or box with a dumbbell in each hand if desired.
Place one foot fully on the box and drive through it to stand on top.
Step back down under control and repeat.
! Don't push off the back foot — let the lead leg do the work.
@Romanian Deadlift (Barbell)
Stand holding a bar or dumbbells in front of your thighs with a slight knee bend.
Push your hips straight back, keeping the weight close to your legs.
Lower until you feel a strong hamstring stretch, usually just below the knees.
Drive your hips forward to stand tall.
! Keep your back flat — this is a hip hinge, not a squat.
@Straight Leg Deadlift
Stand holding a bar with your legs almost straight.
Hinge at the hips and lower the bar down your legs.
Stand back up by squeezing your glutes.
! Stop when your lower back wants to round, even if the bar hasn't reached the floor.
@Lying Leg Curl (Machine)
Lie face down on the machine with the pad just above your heels.
Curl your heels toward your glutes.
Squeeze, then lower slowly.
! Keep your hips pressed into the bench.
@Seated Leg Curl (Machine)
Sit in the machine with the pad on the back of your lower legs, thighs secured.
Curl your heels down and back as far as you can.
Return slowly to the start.
! Keep your back against the pad and avoid jerking the weight.
@Good Morning (Barbell)
Place a light barbell on your upper back, feet shoulder-width apart, knees slightly bent.
Hinge at the hips, pushing them back until your torso is almost parallel to the floor.
Squeeze your glutes to return to standing.
! Start very light — this exercise punishes poor form.
@Glute Ham Raise
Secure your feet in the GHD with your knees just behind the pad.
Lower your torso toward the floor with a straight body.
Curl back up using your hamstrings and glutes.
! Cross your arms on your chest and keep your hips extended.
@Hip Thrust (Barbell)
Sit with your upper back against a bench and a padded barbell across your hips.
Plant your feet and drive through your heels to lift your hips.
Squeeze your glutes at the top until your torso is flat.
Lower and repeat.
! Tuck your chin and ribs down — don't over-arch your back at the top.
@Glute Bridge
Lie on your back with knees bent and feet flat on the floor.
Drive through your heels to lift your hips until your body forms a straight line.
Squeeze your glutes at the top, then lower.
! Add a barbell or dumbbell on your hips once bodyweight feels easy.
@Standing Cable Glute Kickbacks
Attach an ankle strap to a low cable and face the machine, holding it for support.
Kick your working leg straight back, squeezing your glute.
Return slowly without letting the weight stack touch down.
! Don't arch your lower back to get extra range of motion.
@Hip Abduction (Machine)
Sit in the machine with the pads on the outsides of your knees.
Push your knees apart as far as is comfortable.
Pause, then slowly bring them back together.
! Leaning forward slightly puts more emphasis on the glutes.
@Standing Calf Raise
Stand on the edge of a platform with the balls of your feet and the pads on your shoulders.
Lower your heels as far as possible for a deep stretch.
Rise up onto your toes as high as you can and pause.
! Go slow — pause at the top and bottom. No bouncing.
@Seated Calf Raise
Sit with your knees under the pad and the balls of your feet on the platform.
Lower your heels for a stretch.
Press up onto your toes and squeeze.
! The bent knee targets the soleus, so use higher reps.
@Calf Press (Machine)
Sit in the leg press and place the balls of your feet on the bottom of the platform.
Press with your toes to extend your ankles.
Lower your heels for a full stretch and repeat.
! Keep your knees nearly straight but not locked.
@Plank
Rest on your forearms and toes with elbows directly under your shoulders.
Keep your body in a straight line from head to heels.
Squeeze your abs and glutes and breathe steadily.
Hold for the target time.
! If your hips sag or pike, end the set — quality over time.
@Side Plank
Lie on your side with your elbow under your shoulder.
Lift your hips so your body is in a straight line from head to feet.
Hold, then repeat on the other side.
! Do both sides for balance. Log each side as a set, or just the weaker side.
@Crunch
Lie on your back with knees bent and hands by your temples.
Curl your shoulders off the floor by contracting your abs.
Lower slowly without resting your head.
! Don't pull on your neck — the movement is small.
@Sit Up
Lie on your back with knees bent and feet flat.
Curl all the way up until your chest meets your thighs.
Lower slowly back down.
! Cross your arms over your chest and avoid yanking with your neck.
@Hanging Leg Raise
Hang from a bar with straight arms.
Raise your legs (bent or straight) until your hips curl up and your thighs reach parallel or higher.
Lower slowly without swinging.
! Tilt your pelvis up at the top — that's what works your abs, not just your hip flexors.
@Cable Crunch
Kneel under a high cable with a rope behind your head.
Crunch down, bringing your elbows toward your thighs while rounding your spine.
Return slowly.
! Move your spine, not your hips — keep your hips still.
@Russian Twist (Bodyweight)
Sit with knees bent, lean back slightly, and lift your feet if you can.
Rotate your torso to one side, then the other.
Hold a weight to make it harder.
! Turn from your ribcage, not just your arms.
@Ab Wheel
Kneel on a mat holding the wheel under your shoulders.
Roll out slowly while keeping your abs tight and back flat.
Roll back to the start by pulling with your abs.
! Only go as far as you can without your lower back sagging.
@Running
Warm up with a few minutes of walking or an easy jog.
Run at a pace where you can still speak in short sentences.
Land softly with your feet under your hips and keep a relaxed upper body.
Cool down with a few minutes of walking.
! Build up distance gradually — add no more than 10% per week.
@Walking
Walk at a brisk pace where you're breathing harder but can still talk.
Keep your head up, shoulders back and swing your arms.
! Brisk walking is easy on joints and great for recovery days.
@Cycling
Set the saddle height so your knee is slightly bent at the bottom of the pedal stroke.
Keep a steady cadence of around 70–90 rpm.
Increase the resistance for harder intervals.
! Keep your shoulders relaxed and your back straight.
@Rowing Machine
Start with your legs bent, arms straight, and shins vertical.
Push through your legs first, then lean back slightly, and finally pull the handle to your lower ribs.
Reverse the order to return: arms, then body, then knees.
! About 60% of the power comes from your legs.
@Stair Machine (Steps)
Stand tall and step steadily, placing your whole foot on each step.
Use the handrails only for balance, not to hold your weight.
! Leaning on the rails reduces the work you're doing.
@Jump Rope
Hold the handles at hip height with your elbows close to your sides.
Turn the rope with your wrists and jump just high enough to clear it.
Land softly on the balls of your feet.
! Start with 30-second rounds and rest between them.
@Bench Press (Smith Machine)
Set the bench under the bar so it lines up with your mid-chest, feet flat on the floor.
Unrack by rotating your wrists to release the hooks, with hands just wider than shoulders.
Lower the bar to your mid-chest under control.
Press up until your arms are straight, then re-hook the bar when finished.
! The fixed bar path means foot and bench position matter — find a spot where the bar travels in a comfortable line.
@Incline Bench Press (Smith Machine)
Set the bench to 30–45° so the bar travels over your upper chest.
Unrack with a grip just wider than your shoulders.
Lower the bar to your upper chest.
Press back up to straight arms and re-hook the bar when done.
! Keep your shoulder blades pinched back and your glutes on the bench.
@Incline Chest Press (Machine)
Adjust the seat so the handles line up with your upper chest.
Sit back with your shoulder blades against the pad and grip the handles.
Press forward and up until your arms are almost straight.
Return slowly until you feel a chest stretch.
! Don't let your shoulders shrug up towards your ears.
@Butterfly (Pec Deck)
Adjust the seat so your upper arms are level with your chest.
Sit back with your chest up and place your forearms or hands on the pads.
Bring the pads together in front of you and squeeze your chest.
Return slowly to a comfortable stretch.
! Don't let the weight stack drop — keep control on the way back.
@Decline Push Up
Place your feet on a bench or step and your hands on the floor slightly wider than shoulders.
Keep your body in a straight line from head to heels.
Lower your chest towards the floor with elbows about 45° from your body.
Push back up to straight arms.
! The higher your feet, the more it works your upper chest and shoulders.
@Incline Push Ups
Place your hands on a bench or sturdy surface, slightly wider than shoulders.
Walk your feet back so your body forms a straight line.
Lower your chest to the edge, then push away until your arms are straight.
! A great way to build up to full push-ups — the higher the surface, the easier it gets.
@Kneeling Push Up
Kneel on a mat with your hands slightly wider than shoulders and your body straight from knees to head.
Lower your chest to just above the floor.
Push back up to straight arms.
! Keep your hips in line with your shoulders — don't stick your bum up.
@Floor Press (Dumbbell)
Lie on the floor with knees bent and dumbbells held above your chest.
Lower until your upper arms touch the floor.
Pause briefly, then press back up to straight arms.
! The floor limits your range, which is easier on the shoulders.
@Seated Chest Flys (Cable)
Sit between two cables set at chest height and hold a handle in each hand.
Lean slightly forward with your elbows slightly bent.
Bring your hands together in front of your chest in a wide arc.
Return slowly until you feel a stretch.
! Keep the elbow bend fixed throughout so it stays a fly, not a press.
@Low Cable Fly Crossovers
Set the pulleys low and stand in a split stance holding a handle in each hand.
Keep a slight elbow bend and lean forward a little.
Sweep your hands up and together to chest height.
Lower slowly back to the start.
! This variation hits the upper chest — imagine scooping your arms upward.
@Incline Chest Fly (Dumbbell)
Set the bench to 30° and lie back with dumbbells above your upper chest, palms facing each other.
Open your arms in a wide arc with a slight elbow bend until you feel a stretch.
Squeeze the weights back together over your chest.
! Go lighter than your flat fly — the stretch is deeper.
@Dumbbell Squeeze Press
Lie on a flat bench with two dumbbells pressed together above your chest.
Squeeze the dumbbells hard against each other throughout the set.
Lower them to your chest, keeping them touching.
Press back up to straight arms.
! The constant squeeze keeps your inner chest working the whole time.
@Chest Dip (Assisted)
Set the assist machine to a weight that lets you do your target reps, and kneel or stand on the pad.
Grip the handles, lean your torso forward and lower until your upper arms are parallel with the floor.
Press back up to straight arms.
! Reduce the assistance over time as you get stronger.
@Lat Pulldown - Close Grip (Cable)
Attach a close-grip (V) handle and sit with your thighs secured.
Lean back slightly and pull the handle to your upper chest, driving your elbows down.
Let your arms rise slowly until fully straight.
! Keep your chest up and don't swing your torso.
@Reverse Grip Lat Pulldown (Cable)
Grip the bar underhand, shoulder-width apart, and sit with thighs secured.
Lean back slightly and pull the bar to your upper chest.
Return slowly until your arms are straight.
! This variation brings in more biceps — keep your elbows tucked close.
@Single Arm Lat Pulldown
Sit or kneel facing a high cable with a single handle.
Pull the handle down towards your shoulder, driving your elbow to your side.
Return slowly until your arm is fully extended.
! Don't twist your torso — keep your shoulders square.
@Seated Row (Machine)
Adjust the seat and chest pad so you can grip the handles with arms extended.
Sit tall with your chest against the pad.
Pull the handles back, squeezing your shoulder blades together.
Return slowly to a full stretch.
! Don't lean back to move the weight.
@Seated Cable Row - V Grip (Cable)
Sit with feet on the plates, knees slightly bent, holding the V handle.
Keep your chest up and back flat.
Pull the handle to your lower stomach, squeezing your shoulder blades together.
Return slowly with arms fully extended.
! Neutral grip keeps your elbows close, which hits the lats well.
@Single Arm Cable Row
Stand or sit facing a cable at chest height holding a single handle.
Pull the handle towards your ribs, keeping your elbow close.
Squeeze your shoulder blade back, then return slowly.
! Resist the cable's pull on the way back — don't let your shoulder roll forward.
@Pendlay Row (Barbell)
Stand over a barbell on the floor and hinge until your back is parallel to the ground.
Grip the bar just outside your legs with a flat back.
Explosively row the bar to your lower chest.
Lower it back to the floor and reset for each rep.
! Every rep starts from a dead stop — keep your back flat and torso still.
@Chest Supported T Bar Row
Lie chest-down on the pad with the handle in both hands.
Pull the weight up, driving your elbows back.
Squeeze your shoulder blades together at the top.
Lower under control.
! The chest support removes lower back strain so you can focus on your back muscles.
@Landmine Row
Straddle one end of a barbell anchored in a landmine and hinge forward with a flat back.
Grip the bar or attachment near the end of the bar.
Row the weight towards your chest.
Lower under control.
! Keep your hips back and your spine neutral.
@Inverted Row
Lie under a fixed bar or rings and grab it with an overhand grip.
Keep your body straight from head to heels with your heels on the floor.
Pull your chest up to the bar.
Lower under control.
! Bend your knees to make it easier, or raise your feet to make it harder.
@Rack Pull
Set the bar on safety pins at knee height inside a power rack.
Grip just outside your legs, brace your core and keep your back flat.
Stand up by driving your hips forward.
Lower the bar back to the pins under control.
! A great way to overload the upper back and lockout.
@Deadlift (Trap bar)
Stand in the centre of the trap bar with feet hip-width apart.
Hinge down and grip the handles, chest up and back flat.
Push the floor away and stand tall.
Lower by hinging at the hips first, then bending the knees.
! Easier on the lower back than a straight bar — a good option for beginners.
@Sumo Deadlift
Stand with feet wider than shoulders and toes pointing out.
Grip the bar inside your knees with arms straight and chest up.
Drive your knees out and push the floor away as you stand.
Lock out your hips at the top and lower under control.
! Keep your knees tracking over your toes as you lift.
@Pull Up (Assisted)
Set the assist machine to a weight that lets you do your target reps and kneel or stand on the pad.
Grip the bar with an overhand grip and pull your chin over the bar.
Lower to a full hang.
! Gradually lower the assistance as you get stronger.
@Chin Up (Assisted)
Set the assist weight and grip the handles with an underhand grip.
Pull until your chin passes the bar.
Lower under control to straight arms.
! Reduce the assistance over time.
@Wide Pull Up
Hang from a bar with an overhand grip much wider than your shoulders.
Pull your elbows down and out until your chin clears the bar.
Lower to a full hang.
! Wider grips shorten the range of motion, so don't cut reps short.
@Dead Hang
Grab a pull-up bar with an overhand grip and let your body hang with arms straight.
Keep your shoulders engaged — don't just relax into your joints.
Hold for the target time.
! Great for grip strength and shoulder health.
@Pullover (Dumbbell)
Lie across or along a bench holding one dumbbell with both hands above your chest.
With a slight elbow bend, lower the dumbbell back behind your head in an arc.
Pull it back over your chest, squeezing your lats.
! Keep your core tight so your ribs don't flare up.
@Rope Straight Arm Pulldown
Stand facing a high cable with a rope, arms straight and a slight hinge at the hips.
Sweep the rope down to your thighs, splitting it apart at the bottom.
Return slowly overhead.
! Keep your arms almost straight — the movement comes from your shoulders.
@Superman
Lie face down with arms extended in front of you.
Lift your arms, chest and legs off the floor at the same time.
Hold for a second, then lower slowly.
! Squeeze your glutes and back — don't crank your neck up.
@Lateral Raise (Machine)
Sit with your arms against the pads and adjust the seat so your elbows line up with the pivot.
Raise your arms out to the sides until they reach shoulder height.
Lower slowly.
! Don't shrug — keep your shoulders down.
@Seated Shoulder Press (Machine)
Adjust the seat so the handles start at shoulder height.
Sit with your back against the pad and press the handles up.
Lower under control to shoulder level.
! Don't fully lock out your elbows at the top.
@Overhead Press (Dumbbell)
Stand with dumbbells at shoulder height, palms facing forward.
Brace your core and press straight up until your arms are straight.
Lower back to shoulder height.
! Squeeze your glutes to avoid leaning back.
@Seated Overhead Press (Dumbbell)
Sit on a bench with back support and dumbbells at shoulder height.
Press the weights up until your arms are straight above you.
Lower slowly to your shoulders.
! Keep your back against the pad and your ribs down.
@Seated Lateral Raise (Dumbbell)
Sit on a bench holding dumbbells at your sides with a slight elbow bend.
Raise your arms out to the sides to shoulder height.
Lower slowly.
! Sitting takes away the momentum, so keep the weight light.
@Front Raise (Cable)
Face away from a low cable and hold the handle between your legs or at your side.
Raise your arm straight in front of you to shoulder height.
Lower slowly.
! Don't lean back to lift the weight.
@Push Press
Hold the bar at your collarbone with a shoulder-width grip.
Dip your knees slightly, then drive up explosively through your legs.
Use that momentum to press the bar overhead to lockout.
Lower back to your shoulders.
! The legs start the movement — the arms finish it.
@Pike Pushup
Start in a downward-dog position with hips high and hands shoulder-width apart.
Bend your elbows and lower the top of your head towards the floor.
Press back up to straight arms.
! Keep your hips high to put the load on your shoulders.
@Handstand Hold
Kick up into a handstand against a wall with hands shoulder-width apart.
Keep your arms straight and your body tight from hands to toes.
Hold for the target time.
! Look at the floor between your hands and keep your core engaged.
@Chest Supported Reverse Fly (Dumbbell)
Lie chest-down on an incline bench with dumbbells hanging below you.
With a slight elbow bend, raise your arms out to the sides.
Squeeze your shoulder blades together, then lower slowly.
! Use light weights — the rear delts are small muscles.
@Band Pullaparts
Hold a resistance band in front of you with straight arms at shoulder height.
Pull the band apart by squeezing your shoulder blades together.
Return slowly with control.
! Keep your shoulders down and away from your ears.
@Shrug (Machine)
Stand or sit in the machine and grip the handles.
Lift your shoulders straight up towards your ears.
Hold for a second, then lower slowly.
! Don't roll your shoulders — straight up and down.
@Standing Military Press (Barbell)
Hold the bar at your collarbone with a grip just outside your shoulders.
Stand tall with feet together, glutes and abs tight.
Press the bar straight up to lockout.
Lower it back to your collarbone.
! The feet-together stance means you can't cheat with your legs.
@Single Arm Landmine Press (Barbell)
Hold the end of a landmine bar at your shoulder with one hand.
Press the bar up and forward until your arm is straight.
Lower under control.
! Gentle on the shoulder joint — brace your core and don't lean back.
@EZ Bar Biceps Curl
Hold an EZ bar on the angled grips with your palms facing up.
Keep your elbows pinned to your sides and curl the bar to your shoulders.
Lower slowly to full arm extension.
! The angled grip is easier on the wrists than a straight bar.
@Preacher Curl (Dumbbell)
Sit at a preacher bench with your upper arm flat on the pad.
Curl the dumbbell up towards your shoulder.
Lower slowly until your arm is almost straight.
! Don't let the weight drop at the bottom — control it.
@Preacher Curl (Machine)
Adjust the seat so your upper arms rest flat on the pad.
Curl the handles up towards your shoulders.
Lower slowly to a full stretch.
! Keep your upper arms flat on the pad throughout.
@Rope Cable Curl
Stand facing a low cable with a rope attachment.
Curl the rope up, keeping your elbows by your sides.
Squeeze at the top and turn your wrists outwards slightly.
Lower slowly.
! Hammer-style grip works the forearms and brachialis too.
@Spider Curl (Dumbbell)
Lie chest-down on an incline bench with your arms hanging straight down holding dumbbells.
Curl the weights up towards your shoulders without moving your upper arms.
Lower slowly.
! The hanging position removes cheating, so keep the weight modest.
@Reverse Curl (Barbell)
Hold a barbell with an overhand grip, shoulder-width apart.
Keep your elbows by your sides and curl the bar up.
Lower slowly.
! Hits your forearms and brachialis — go lighter than a normal curl.
@Zottman Curl (Dumbbell)
Curl dumbbells up with palms facing forward.
At the top, rotate your wrists so palms face down.
Lower slowly in this overhand position, then rotate back at the bottom.
! The slow lowering phase is the hard part — go light.
@Hammer Curl (Cable)
Attach a rope to a low cable and stand facing it.
Curl the rope up with palms facing each other.
Squeeze at the top and lower slowly.
! Keep your elbows close to your sides throughout.
@Cross Body Hammer Curl
Stand with dumbbells at your sides, palms facing in.
Curl one dumbbell across your body towards the opposite shoulder.
Lower slowly and repeat on the other side.
! Keep your upper arm still — only your forearm moves.
@Bicep Curl (Machine)
Adjust the seat so your upper arms rest on the pad.
Grip the handles and curl them up towards your shoulders.
Lower slowly until your arms are almost straight.
! Control the weight on the way down.
@Triceps Rope Pushdown
Stand facing a high cable with a rope and your elbows pinned to your sides.
Push the rope down and spread the ends apart at the bottom.
Return slowly until your forearms are just past parallel.
! Spreading the rope at the bottom squeezes the triceps harder.
@Triceps Pressdown
Stand facing a high cable with a bar and elbows tucked in.
Press the bar down until your arms are straight.
Return slowly to the start.
! Don't let your elbows drift forward.
@Reverse Grip Triceps Pushdown
Hold a straight bar with an underhand grip and elbows tucked in.
Push the bar down until your arms are straight.
Return slowly.
! Use less weight than overhand pushdowns — the grip is weaker.
@Single Arm Triceps Pushdown (Cable)
Stand facing a high cable with a single handle and your elbow tucked to your side.
Push down until your arm is fully straight.
Return slowly.
! Don't lean into the movement — keep your torso steady.
@Diamond Push Up
Start in a high plank with your hands together under your chest, forming a diamond with thumbs and index fingers.
Lower your chest to your hands.
Push back up to straight arms.
! Tough on the wrists — drop to your knees if needed.
@Push Up - Close Grip
Start in a high plank with your hands directly under your shoulders.
Keep your elbows tucked close to your sides as you lower your chest.
Push back up to straight arms.
! More triceps and less chest than a standard push-up.
@Triceps Extension (Cable)
Stand facing a cable with a rope or bar and hinge slightly forward.
Extend your arms straight, keeping your elbows by your ears.
Return slowly.
! Keep your upper arms still — only your forearms move.
@Triceps Extension (Dumbbell)
Hold one dumbbell overhead with both hands and elbows pointing forward.
Lower the dumbbell behind your head by bending your elbows.
Extend back up to straight arms.
! Keep your elbows close to your ears and core tight.
@Skullcrusher (Dumbbell)
Lie on a bench holding dumbbells above your chest with palms facing each other.
Bend your elbows to lower the weights beside your head.
Extend your arms back up.
! Keep your upper arms still and use a weight you can control.
@Seated Dip Machine
Adjust the seat so the handles are at the sides of your chest.
Press the handles down until your arms are straight.
Return slowly.
! Keep your shoulders down and back against the pad.
@Triceps Dip (Assisted)
Set the assist weight and kneel or stand on the pad, gripping the handles.
Lower until your upper arms are parallel to the floor, torso upright.
Press back up to straight arms.
! Reduce the assistance gradually as you get stronger.
@JM Press (Barbell)
Lie on a bench with a bar over your chest and a close grip.
Lower the bar towards your upper chest/chin by bending elbows forward.
Press back up.
! A hybrid between a close-grip press and a skullcrusher — use a spotter.
@Triceps Kickback (Cable)
Hinge forward and hold a cable handle with your upper arm parallel to the floor.
Extend your elbow to straighten your arm behind you.
Return slowly.
! Keep your upper arm still and the cable tension constant.
@Squat (Smith Machine)
Place the bar on your upper back and step your feet slightly forward of the bar.
Release the hooks and squat down until your thighs are parallel.
Drive up through your whole foot to stand.
! Feet forward of the bar lets you sit back and keeps your knees comfortable.
@Squat (Dumbbell)
Hold dumbbells at your sides or at your shoulders.
Squat down with your chest up until your thighs are parallel.
Stand back up by driving through your feet.
! Keep your weight over mid-foot.
@Squat (Bodyweight)
Stand with feet shoulder-width apart and arms out in front.
Squat down until your thighs are parallel to the floor.
Drive up through your feet to stand tall.
! Keep your chest up and knees tracking over your toes.
@Lunge
Stand tall, step forward and lower your back knee towards the floor.
Keep your front knee above your ankle.
Push off your front foot to return to the start.
! Alternate legs or complete all reps on one side first.
@Reverse Lunge (Dumbbell)
Hold dumbbells at your sides and step one foot backwards.
Lower your back knee towards the floor, front shin vertical.
Push through your front heel to return to the start.
! Easier on the knees than forward lunges.
@Split Squat (Dumbbell)
Stand in a staggered stance holding dumbbells at your sides.
Lower your back knee straight down towards the floor.
Drive through your front heel to stand.
! Keep your torso upright and your front foot flat.
@Leg Press Horizontal (Machine)
Sit or lie back in the machine with your feet flat on the platform.
Release the safety and lower the platform until your knees are about 90°.
Press back up without locking your knees.
! Keep your lower back pressed against the seat.
@Single Leg Press (Machine)
Sit in the machine with one foot in the middle of the platform.
Lower until your knee is about 90°, then press back up.
Complete all reps, then switch legs.
! Use lighter weight than a two-leg press and keep your hips level.
@Pistol Squat
Stand on one leg with the other leg extended in front.
Lower slowly into a deep single-leg squat.
Drive up through your heel to stand.
! Hold on to a support or sit onto a box until you build strength.
@Wall Sit
Stand with your back against a wall and slide down until thighs are parallel to the floor.
Keep your knees above your ankles and back flat against the wall.
Hold for the target time.
! Keep your weight on your heels.
@Box Squat (Barbell)
Set a box behind you at about parallel height.
Squat back and sit onto the box under control.
Pause briefly, then drive up to stand.
! Don't relax on the box — stay tight.
@Jump Squat
Squat down until your thighs are parallel to the floor.
Explode up into a jump.
Land softly and go straight into the next squat.
! Land with bent knees to absorb impact.
@Sumo Squat (Dumbbell)
Stand with feet wide and toes turned out, holding a dumbbell between your legs.
Squat down with your chest up and knees tracking over your toes.
Stand back up by squeezing your glutes.
! Great for the inner thighs and glutes.
@Hack Squat (Machine)
Position your shoulders under the pads and feet shoulder-width on the platform.
Release the safety and lower until your knees reach about 90° or deeper.
Drive back up without locking out.
! Feet lower on the platform emphasise the quads.
@Zercher Squat
Hold the bar in the crook of your elbows against your stomach.
Squat down while keeping your chest up.
Stand back up.
! Use padding on the bar — it can be uncomfortable on the arms.
@Walking Lunge (Dumbbell)
Hold dumbbells at your sides and take a big step forward.
Lower your back knee towards the floor.
Push through the front foot and step through into the next lunge.
! Keep your torso tall and take long strides.
@Dumbbell Step Up
Hold dumbbells at your sides facing a bench or box.
Place one foot on the box and drive up to stand on it.
Step down under control and repeat.
! Let the working leg do the lifting, not the trailing leg.
@Romanian Deadlift (Dumbbell)
Stand holding dumbbells in front of your thighs with a slight knee bend.
Push your hips back and lower the weights down your legs.
Stop when you feel a strong hamstring stretch, then drive your hips forward.
! Keep your back flat and the weights close to your legs.
@Single Leg Romanian Deadlift (Dumbbell)
Stand on one leg holding a dumbbell in the opposite hand.
Hinge at the hips and extend your free leg behind you.
Lower the weight towards the floor, then return to standing.
! Keep your hips square to the floor.
@Nordic Hamstrings Curls
Kneel on a pad with your ankles secured.
Lower your torso forward as slowly as you can.
Catch yourself with your hands and push back up.
! Very tough — use bands for assistance or only lower as far as you can control.
@Standing Leg Curls
Stand at a leg curl machine or use an ankle cable strap.
Curl one heel up towards your glutes.
Lower slowly.
! Keep your hips and torso still.
@Hip Thrust
Sit with your upper back against a bench and your feet flat.
Drive through your heels to lift your hips until your torso is flat.
Squeeze your glutes at the top, then lower.
! Tuck your chin and don't over-arch your lower back.
@Hip Thrust (Dumbbell)
Sit with your upper back against a bench and a dumbbell resting on your hips.
Drive your hips up until your torso is flat.
Squeeze your glutes, then lower.
! Use a pad to protect your hips.
@Cable Pull Through
Face away from a low cable with the rope between your legs.
Hinge at the hips and push your hips back.
Drive your hips forward to stand tall, squeezing your glutes.
! It's a hip hinge — don't squat it.
@Kettlebell Swing
Stand with feet shoulder-width apart and a kettlebell on the floor in front of you.
Hike the bell back between your legs, then drive your hips forward.
Let the kettlebell swing to chest height.
Hinge back and let it swing between your legs again.
! The power comes from your hips, not your arms.
@Clamshell
Lie on your side with knees bent and feet together.
Open your top knee like a clamshell without moving your pelvis.
Lower slowly.
! Add a resistance band above your knees to make it harder.
@Fire Hydrants
Start on all fours with hands under shoulders and knees under hips.
Lift one knee out to the side while keeping it bent.
Lower slowly and repeat.
! Keep your hips level — don't rotate your torso.
@Frog Pumps (Dumbbell)
Lie on your back with the soles of your feet together and knees out.
Hold a dumbbell on your hips and drive your hips up.
Squeeze your glutes, then lower.
! Keep your heels together and push through the outside of your feet.
@Single Leg Hip Thrust
Sit with your upper back against a bench with one foot planted and the other leg extended.
Drive through your heel to lift your hips.
Squeeze, then lower slowly.
! Keep your hips level — don't let one side drop.
@Hip Adduction (Machine)
Sit in the machine with pads on the insides of your knees.
Squeeze your legs together.
Pause, then slowly open back out.
! Don't let the weights slam at the end.
@Glute Kickback (Machine)
Position yourself on the machine with the pad behind your heel.
Kick your leg back and squeeze your glute.
Return slowly.
! Don't arch your lower back to get extra range.
@Standing Calf Raise (Machine)
Position your shoulders under the pads with the balls of your feet on the platform.
Lower your heels for a deep stretch.
Rise up onto your toes and pause.
! Full range of motion matters more than heavy weight.
@Standing Calf Raise (Barbell)
Rest a bar on your upper back and stand with the balls of your feet on a raised platform.
Lower your heels for a deep stretch.
Rise up as high as you can.
! Slow and controlled — no bouncing.
@Single Leg Standing Calf Raise
Stand on one foot on the edge of a step, holding a support for balance.
Lower your heel below the step.
Rise up onto your toes as high as you can.
! Keep your knee almost straight.
@Dead Bug
Lie on your back with arms pointing to the ceiling and knees bent at 90°.
Slowly lower one arm overhead and the opposite leg towards the floor.
Return to the start and switch sides.
! Press your lower back into the floor the whole time.
@Bird Dog
Start on all fours with hands under shoulders and knees under hips.
Extend one arm forward and the opposite leg back.
Hold, then return and switch sides.
! Keep your hips level and your spine neutral.
@Bicycle Crunch
Lie on your back with hands by your temples.
Bring one elbow towards the opposite knee while extending the other leg.
Alternate sides in a pedalling motion.
! Rotate from your ribcage — don't just move your elbows.
@Mountain Climber
Start in a high plank with hands under shoulders.
Drive one knee towards your chest, then switch legs quickly.
Keep your hips low and your core tight.
! Keep your shoulders over your hands.
@Lying Leg Raise
Lie on your back with legs straight and hands under your hips.
Raise your legs until they're vertical.
Lower slowly without letting your heels touch the floor.
! Press your lower back into the floor.
@Hanging Knee Raise
Hang from a bar with straight arms.
Raise your knees towards your chest, curling your pelvis up.
Lower slowly without swinging.
! Curl your hips up at the top rather than just lifting your legs.
@Reverse Crunch
Lie on your back with your knees bent at 90°.
Curl your hips off the floor, bringing your knees towards your chest.
Lower slowly.
! Use your abs — don't swing your legs.
@V Up
Lie flat with arms overhead and legs straight.
Lift your arms and legs at the same time to meet in a V.
Lower slowly.
! Keep your legs straight if you can, but bend them if needed.
@Flutter Kicks
Lie on your back with legs straight and hands under your hips.
Lift your legs slightly off the floor.
Kick your legs up and down in small alternating motions.
! Press your lower back into the floor.
@Cable Core Pallof Press
Stand side-on to a cable at chest height and hold the handle at your chest.
Press the handle straight out in front of you.
Hold for a second, then bring it back.
! Don't let the cable rotate your torso — resist it.
@Toes to Bar
Hang from a bar with straight arms.
Lift your legs until your toes touch the bar.
Lower slowly.
! Build up with knee raises and hanging leg raises first.
@L-Sit Hold
Support yourself on parallel bars or the floor with straight arms.
Lift your legs so they're straight out in front of you.
Hold for the target time.
! Press down through your hands and keep your legs straight.
@Dragon Flag
Lie on a bench holding the edge behind your head.
Lift your whole body off the bench so only your upper back touches.
Lower your body slowly as one straight line.
! Advanced — start with bent knees.
@Decline Crunch
Secure your feet on a decline bench and lie back.
Curl your shoulders up by contracting your abs.
Lower slowly.
! Keep the movement small and controlled.
@Hollow Rock
Lie on your back with arms overhead and legs straight, lifting your shoulders and legs off the floor.
Rock gently back and forth while keeping your body in a banana shape.
! Keep your lower back pressed into the floor.
@Reverse Plank
Sit with legs straight and hands behind you, fingers pointing at your feet.
Lift your hips until your body is straight from head to heels.
Hold for the target time.
! Keep your hips high and squeeze your glutes.
@Treadmill
Start with a few minutes of walking to warm up.
Set a speed and incline you can sustain and keep a natural stride.
Cool down by slowing gradually.
! Avoid holding the handrails — it reduces the work you're doing.
@Elliptical Trainer
Step on and hold the handles with a light grip.
Move in a smooth, circular motion, pushing through your heels.
Increase the resistance for a harder workout.
! Stand tall and don't lean on the handles.
@Burpee
Stand tall, then squat and place your hands on the floor.
Jump your feet back to a plank, do a push-up.
Jump your feet back in and explode up into a jump.
! Scale by stepping back instead of jumping.
@Box Jump
Stand in front of a sturdy box with feet shoulder-width apart.
Swing your arms and jump up onto the box, landing softly.
Stand tall, then step back down.
! Step down rather than jumping to protect your joints.
@Jumping Jack
Stand with feet together and arms by your sides.
Jump your feet out wide while raising your arms overhead.
Jump back to the start.
! Land softly on the balls of your feet.
@High Knees
Stand tall and run in place, driving your knees up to hip height.
Pump your arms in rhythm.
! Stay on the balls of your feet and keep your chest up.
@Battle Ropes
Hold one end of a heavy rope in each hand, knees slightly bent.
Alternate raising and lowering your arms to create waves in the rope.
! Keep your core tight and move from your shoulders.
@Swimming
Warm up with an easy lap or two.
Swim at a pace you can sustain with controlled breathing.
Cool down with a slow lap.
! Mix up strokes to work different muscles.
@Farmers Walk
Pick up a heavy dumbbell or kettlebell in each hand.
Stand tall with shoulders back and walk with short, quick steps.
Walk for distance or time, then set them down carefully.
! Don't let the weights swing, and keep your core braced.
@Kettlebell Turkish Get Up
Lie on your back holding a kettlebell straight up in one hand.
Roll to your elbow, then your hand, lift your hips, sweep your leg through and stand.
Reverse the steps to lie back down.
! Keep your eyes on the kettlebell and start very light.
@Ball Slams
Hold a slam ball overhead with both hands.
Slam it into the floor as hard as you can.
Catch it on the bounce and repeat.
! Use your whole body — rise on your toes and slam down.
@Power Clean
Start with the bar over mid-foot, hinge down and grip just outside your legs.
Pull explosively, extending your hips and shrugging.
Catch the bar on your front shoulders in a quarter squat.
Stand tall, then lower the bar.
! Learn the technique with a light bar or a coach first.
@Thruster (Barbell)
Hold the bar on your front shoulders and squat down.
Drive up explosively and press the bar overhead in one movement.
Lower the bar back to your shoulders as you descend into the next squat.
! Use your legs' momentum to help the press.
@Sled Push
Load a sled and grip the handles with your arms straight.
Lean forward and drive with your legs in short, powerful steps.
Push for the target distance.
! Keep your back flat and your core braced.
@Wall Ball
Hold a medicine ball at your chest and face a wall.
Squat down, then drive up and throw the ball to a target on the wall.
Catch it and go straight into the next squat.
! Use your legs to power the throw.

/* sanity check for a logged set. Returns a short description if it looks like a typo, else null.

    if(mw>0&&w>mw*3)return `${what} on ${nm} is far above your usual (around ${dw(mw)} ${U()}).`;
    if(mw>0&&w>0&&w<mw/8&&t!=='drop')return `${what} on ${nm} is far below your usual (around ${dw(mw)} ${U()}).`}

  if(mr>0&&r>mr*3&&r-mr>(ty==='time'?120:15))return `${what} on ${nm} is far above your usual (around ${ty==='time'?fmtSec(mr):mr+' reps'}).`;

/* ---------- charts ---------- */
function lineChart(pts,fmt){
  if(!pts.length)return '<p class="muted sm">No data yet — log a workout with this exercise.</p>';
  const W=320,H=160,L=40,R=10,T=12,B=24;
  let x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x)),y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));
  if(x0===x1){x0-=864e5;x1+=864e5}
  if(y0===y1){y0=y0*.9;y1=y1*1.1+1}
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>H-B-(y-y0)/(y1-y0)*(H-T-B);
  const path=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
  /* month ticks along the x-axis: step 1/2/3/6/12 months so there are never more than ~6 labels */
  const mStart=new Date(x0);mStart.setHours(0,0,0,0);mStart.setDate(1);
  const all=[];for(let d=new Date(mStart);d.getTime()<=x1;d.setMonth(d.getMonth()+1)){if(d.getTime()>=x0)all.push(new Date(d))}
  const step=[1,2,3,6,12].find(s=>Math.ceil(all.length/s)<=6)||12;
  const ticks=all.filter((d,i)=>i%step===0);
  let xaxis;
  if(ticks.length<2){
    xaxis=`<text x="${L}" y="${H-6}" font-size="10" fill="var(--mut)">${fmtDateY(pts[0].x)}</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--mut)">${fmtDateY(pts[pts.length-1].x)}</text>`;
  }else{
    xaxis=ticks.map((d,i)=>{const x=X(d.getTime()),yr=d.getMonth()===0||i===0,anc=x<L+14?'start':x>W-R-14?'end':'middle';
      return `<line x1="${x.toFixed(1)}" y1="${T}" x2="${x.toFixed(1)}" y2="${H-B}" stroke="var(--line)" stroke-dasharray="2 3"/>
      <text x="${x.toFixed(1)}" y="${H-6}" text-anchor="${anc}" font-size="10" fill="var(--mut)">${d.toLocaleDateString(undefined,{month:'short'})}${yr?" '"+String(d.getFullYear()).slice(2):''}</text>`}).join('');
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
  ${ticks.length<2?'':xaxis}
  <line x1="${L}" y1="${Y(y0)}" x2="${W-R}" y2="${Y(y0)}" stroke="var(--line)"/><line x1="${L}" y1="${Y(y1)}" x2="${W-R}" y2="${Y(y1)}" stroke="var(--line)"/>
  <text x="${L-4}" y="${Y(y1)+4}" text-anchor="end" font-size="10" fill="var(--mut)">${fmt(y1)}</text>
  <text x="${L-4}" y="${Y(y0)+4}" text-anchor="end" font-size="10" fill="var(--mut)">${fmt(y0)}</text>
  <path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="var(--acc)"/>`).join('')}
  ${ticks.length<2?xaxis:''}</svg>`}
function barChart(vals,labels){
  const W=320,H=140,L=10,R=10,T=16,B=22,max=Math.max(1,...vals),bw=(W-L-R)/vals.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${vals.map((v,i)=>{const h=(H-T-B)*v/max,x=L+i*bw+bw*.15;
    return `<rect x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${v?'var(--acc)':'var(--line)'}"/>

  return `<section class="card"><div class="exh"><span class="nm" data-act="exInfo" data-id="${ex.id}">${esc(ex.name)}</span>

    <textarea rows="1" data-f="inote" data-i="${i}" placeholder="Exercise notes (e.g. seat 4, slow negatives)" style="margin-bottom:6px">${esc(it.note||'')}</textarea>
    <div class="srow head" style="grid-template-columns:${setCols(t)}">${head}</div>${rows}

function summaryLines(w,prs){prs=prs||[];return w.items.map(it=>{const ex=exById(it.exId);let best='';

function workoutCard(w){const prs=prsFor(w);return `<div class="card" data-act="viewWorkout" data-id="${w.id}"><div class="row-b"><b>${esc(w.name)}</b><span class="muted sm">${fmtDate(w.start)}</span></div>

function vCalendar(){

  let cells=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')+'<div class="cd blank"></div>'.repeat(lead);
  let nAct=0;
  for(let d=1;d<=days;d++){const k=`${y}-${pad(m+1)}-${pad(d)}`,ws=by[k]||[];if(ws.length)nAct++;

  else below=`<h2>${title} <span class="sm">· ${mws.length} workout${mws.length===1?'':'s'} on ${nAct} day${nAct===1?'':'s'} · ${fmtVol(mws.reduce((a,w)=>a+volumeOf(w.items),0))}</span></h2>`+(mws.map(workoutCard).join('')||'<p class="muted">No workouts this month.</p>');

function statExList(){return S.exercises.filter(e=>exHistory(e.id).length)}

function vStats(){
  const ws=S.workouts,now=Date.now(),cur=weekStart(now),wk=ws.filter(w=>w.start>=cur);
  const vals=[],labs=[];for(let i=7;i>=0;i--){const a=cur-i*6048e5,b=a+6048e5;vals.push(ws.filter(w=>w.start>=a&&w.start<b).length);const d=new Date(a);labs.push(`${d.getDate()}/${d.getMonth()+1}`)}

  ${prs.length?`<h2>Personal records</h2><div class="card">${prs.map(p=>`<div class="li"><div><div>${esc(p.e.name)}</div><div class="sm muted">${p.wId===p.oId?fmtDateY(p.wT):`Heaviest ${fmtDateY(p.wT)} · 1RM ${fmtDateY(p.oT)}`}</div></div><span class="sm" style="text-align:right"><b class="plink" data-act="viewWorkout" data-id="${p.wId}">${dw(p.bw)} ${U()} × ${p.br} ›</b><br><span class="muted plink" data-act="viewWorkout" data-id="${p.oId}">1RM ≈ ${Math.round(dw(p.b1))} ›</span></span></div>`).join('')}</div>`:''}
  <h2>Settings & backup</h2><div class="card">
  <label class="lb" style="margin-top:0">Appearance</label><div class="seg"><button class="${S.settings.theme!=='light'?'on':''}" data-act="theme" data-v="dark">Dark</button><button class="${S.settings.theme==='light'?'on':''}" data-act="theme" data-v="light">Light</button></div><label class="lb">Units</label><div class="seg"><button class="${U()==='kg'?'on':''}" data-act="unit" data-u="kg">kg</button><button class="${U()==='lb'?'on':''}" data-act="unit" data-u="lb">lb</button></div>
