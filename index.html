<style>
:root{--bg:#0b0b0f;--card:#15151c;--card2:#20202a;--txt:#f5f2f5;--mut:#a39aa3;--acc:#ff4fa3;--ok:#2ecc71;--bad:#e5484d;--line:#30303a;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:14px 14px calc(150px + var(--safe));max-width:640px;margin:0 auto}

.title{font-size:20px;font-weight:700;background:transparent;border:0;padding:6px 0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}

const MUSCLES=['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Core','Cardio','Other'];
const TYPES={wr:'Weight & reps',reps:'Bodyweight reps',time:'Duration (sec)'};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
function seedExercises(){const out=[];let m='Other';
  SEED.split('\n').forEach(l=>{l=l.trim();if(!l)return;
    if(l[0]==='#'){m=l.slice(1).trim();return}
    const [name,type]=l.split('|');out.push({id:'s_'+slug(name),name,muscle:m,type:type||'wr',custom:false})});
  return out}

/* ---------- state ---------- */
const KEY='ironlog.v1'; /* unchanged on purpose so existing saved data keeps loading */
const fresh=()=>({exercises:seedExercises(),routines:[],workouts:[],active:null,settings:{unit:'kg',rest:90},restByEx:{}});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.exercises)&&Array.isArray(d.workouts)){d.routines=d.routines||[];d.restByEx=d.restByEx||{};d.settings=Object.assign({unit:'kg',rest:90},d.settings);return d}}catch(e){}return fresh()}
let S=load();
function exerciseKey(n){return String(n||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim().replace(/ +/g,' ')}
function sameExercise(a,b){
 const clean=x=>exerciseKey(x).split(' ').filter(w=>w!=='the');
 const x=clean(a),y=clean(b);if(x.join(' ')===y.join(' '))return true;
 if(!x.length||!y.length)return false;
 return x.filter(w=>y.includes(w)).length/Math.max(x.length,y.length)>=.9;
}
function cl
