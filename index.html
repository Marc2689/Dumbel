/* ---------- plate / bar weight calculator ---------- */
const PLATES={kg:[25,20,15,10,5,2.5,1.25,0.5],lb:[45,35,25,10,5,2.5,1.25]};
const barDisp=b=>U()==='lb'?(b.lb!=null?b.lb:+(b.kg*2.20462).toFixed(1)):b.kg;
const fmtN=n=>String(+(+n).toFixed(2));
function curBar(exId){return S.bars.find(b=>b.id===S.barByEx[exId])||S.bars[0]}
function calcPlates(target,bar){
  const side=(target-bar)/2;if(!(target>0))return null;
  if(side<-1e-9)return {below:true};
  let rem=Math.round(side*1e4)/1e4;const out=[];
  PLATES[U()].forEach(p=>{const n=Math.floor(rem/p+1e-9);if(n>0){out.push([p,n]);rem=Math.round((rem-n*p)*1e4)/1e4}});
  return {out,left:rem,total:+(target-2*rem).toFixed(2)}}
function calcResult(){const c=ui.calc,ex=exById(c.exId),bar=curBar(c.exId),bw=barDisp(bar),t=parseFloat(String(c.t).replace(',','.'));
  const r=calcPlates(t,bw);
  if(!r)return '<p class="muted">Enter a target weight to see what to load.</p>';
  if(r.below)return `<p class="muted">Target is lighter than the ${esc(bar.name)} (${fmtN(bw)} ${U()}).</p>`;
  const plates=r.out.length?r.out.map(([p,n])=>`<div class="kv"><small>${fmtN(p)} ${U()}</small><b>${n} × per side</b></div>`).join(''):'<p class="muted">No plates – bar only.</p>';
  return `<div class="grid2" style="margin-top:8px">${plates}</div>
    <p class="sm" style="margin:10px 0 0">${esc(bar.name)} ${fmtN(bw)} + 2 × ${fmtN((r.total-bw)/2)} = <b>${fmtN(r.total)} ${U()}</b></p>
    ${r.left>0?`<p class="sm" style="color:var(--bad);margin:4px 0 0">Can't make ${fmtN(t)} exactly with standard plates – closest is ${fmtN(r.total)} ${U()}.</p>`:''}
    <button class="btn big" data-act="calcApply" data-w="${r.total}">Use ${fmtN(r.total)} ${U()} for next set</button>`}
function drawCalc(){const c=ui.calc,ex=exById(c.exId),cur=curBar(c.exId);
  sheet(`<div class="row-b"><h1 style="margin:0">Weight calculator</h1><button class="btn sm" data-act="close1">Close</button></div>
  <div class="muted">${esc(ex.name)}</div>
  <h2>Bar / machine</h2>
  <div class="chips" style="flex-wrap:wrap">${S.bars.map(b=>`<button class="chip ${b.id===cur.id?'on':''}" data-act="calcBar" data-id="${b.id}">${esc(b.name)} · ${fmtN(barDisp(b))} ${U()}</button>`).join('')}</div>
  <h2>Target weight (${U()})</h2>
  <input inputmode="decimal" data-f="calcw" placeholder="e.g. 100" value="${esc(c.t)}">
  <div id="calcres">${calcResult()}</div>
  <h2>Add custom bar / machine weight</h2>
  <p class="muted sm" style="margin:0 0 8px">Empty bar weight, or the weight of a machine's sled / carriage before plates.</p>
  <input data-f="barname" placeholder="Name (e.g. Leg press sled)" value="${esc(c.nn)}">
  <div class="grid2" style="margin-top:8px"><input inputmode="decimal" data-f="barw" placeholder="Weight (${U()})" value="${esc(c.nw)}"><button class="btn acc" data-act="addBar">Add</button></div>
  <h2>Manage</h2>${S.bars.map(b=>`<div class="li"><span>${esc(b.name)} · ${fmtN(barDisp(b))} ${U()}</span><button class="btn sm danger" data-act="delBar" data-id="${b.id}">Remove</button></div>`).join('')}`)}
/* ---------- picker (layer 2) ---------- */
function pickerList(){const q=ui.pk.q.trim().toLowerCase();

/* ---------- rest timer / clock ---------- */
let audio;
function beep(){try{navigator.vibrate&&navigator.vibrate([200,100,200]);audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(audio.currentTime+.35)}catch(e){}}
function fanfare(){try{navigator.vibrate&&navigator.vibrate([100,60,100,60,250]);audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();
  const t0=audio.currentTime+.02;
  [[523.25,0,.14],[659.25,.13,.14],[783.99,.26,.14],[1046.5,.39,.55],[783.99,.39,.55],[1318.5,.39,.55]].forEach(([f,d,l])=>{
    const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(audio.destination);
    g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.16,t0+d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d+l);o.start(t0+d);o.stop(t0+d+l+.05)})}catch(e){}}
function celebrate(name,title,detail){const el=$('#pr');
  const conf=Array.from({length:22},()=>`<span class="conf" style="left:${Math.random()*100}%;animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.8}s">${['🎉','✨','🏆','💪','⭐'][Math.floor(Math.random()*5)]}</span>`).join('');
  el.innerHTML=conf+`<div class="pr-card"><div class="trophy">🏆</div><h2>New Personal Record!</h2><div style="font-size:18px;font-weight:700">${esc(name)}</div><div class="muted" style="margin-top:4px">${esc(title)}</div><div style="font-size:26px;font-weight:800;color:var(--acc);margin:10px 0 16px">${esc(detail)}</div><button class="btn big" data-act="prClose">Let's go! 💪</button></div>`;
  el.hidden=false;fanfare()}
function checkPR(A,it,s){const h=exHistory(it.exId);if(!h.length)return;
  let oW=Math.max(...h.map(x=>x.maxW)),o1=Math.max(...h.map(x=>x.best1));
  A.items.forEach(i=>{if(i.exId!==it.exId)return;i.sets.forEach(x=>{if(x===s||!x.done||x.t==='warmup')return;oW=Math.max(oW,x.w||0);o1=Math.max(o1,e1rm(x.w,x.r))})});
  const w=s.w||0,n1=e1rm(s.w,s.r),name=exById(it.exId).name;
  if(w>oW+1e-9)celebrate(name,'Heaviest weight ever',`${dw(w)} ${U()} × ${s.r}`);
  else if(n1>o1+1e-9)celebrate(name,'New estimated 1-rep max',`≈ ${Math.round(dw(n1))} ${U()}`)}
/* records a finished workout set, worked out from the history before it (so it also covers old and edited workouts) */
function prsFor(w){const out=[],seen=new Set();
  w.items.forEach(it=>{if(seen.has(it.exId))return;seen.add(it.exId);if(exById(it.exId).type!=='wr')return;
    const sets=w.items.filter(i=>i.exId===it.exId).flatMap(i=>i.sets).filter(s=>s.t!=='warmup');if(!sets.length)return;
    const prior=S.workouts.filter(x=>x.id!==w.id&&x.start<w.start).flatMap(x=>x.items.filter(i=>i.exId===it.exId).flatMap(i=>i.sets)).filter(s=>s.t!=='warmup');if(!prior.length)return;
    const oW=Math.max(0,...prior.map(s=>s.w||0)),o1=Math.max(0,...prior.map(s=>e1rm(s.w,s.r)));
    const nW=Math.max(0,...sets.map(s=>s.w||0)),n1=Math.max(0,...sets.map(s=>e1rm(s.w,s.r)));
    if(nW>oW+1e-9)out.push({exId:it.exId,kind:'weight',v:nW});else if(n1>o1+1e-9)out.push({exId:it.exId,kind:'1rm',v:n1})});
  return out}
const prText=p=>p.kind==='weight'?`Heaviest set ${dw(p.v)} ${U()}`:`Est. 1RM ≈ ${Math.round(dw(p.v))} ${U()}`;
function updateRest(){
  const A=S.active,r=$('#rest');
  if(!A||!A.restEnd){r.hidden=true;return}
  const left=A.restEnd-Date.now();
  if(left<=0){A.restEnd=null;save();r.hidden=true;beep();toast('Rest over — next set!');return}
  r.hidden=false;const s=Math.ceil(left/1000);
  $('#resttime').textContent=`${Math.floor(s/60)}:${pad(s%60)}`;
  $('#restfill').style.width=(100*(1-left/(A.restTotal||left)))+'%'}
setInterval(()=>{updateRest();const el=$('#elapsed');if(el&&S.active)el.textContent=fmtDur(Date.now()-S.active.start)},1000);
async function keepAwake(){try{if(S.active&&navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)keepAwake()});

/* ---------- actions ---------- */
function startWorkout(items,name){S.active={id:uid(),name:name||workoutName(),note:'',start:Date.now(),items,restEnd:null};save();ui.tab='workout';sheet('');render();keepAwake();window.scrollTo(0,0)}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const ACT={
  tab(t){ui.tab=t.dataset.t;render();window.scrollTo(0,0)},
  close1(){sheet('');render()},close2(){sheet('',2)},
  calc(t){const i=+t.dataset.i,it=S.active.items[i];if(!it)return;
    const s=it.sets.find(s=>!s.done&&s.w!=='')||[...it.sets].reverse().find(s=>s.w!=='');
    ui.calc={i,exId:it.exId,t:s?String(dw(s.w)):'',nn:'',nw:''};drawCalc()},
  calcBar(t){S.barByEx[ui.calc.exId]=t.dataset.id;save();drawCalc()},
  calcApply(t){const A=S.active,it=A&&A.items[ui.calc.i];if(!it)return;const w=tk(t.dataset.w);
    let s=it.sets.find(s=>!s.done);if(!s){s=blank();it.sets.push(s)}s.w=w;save();sheet('');render();toast('Weight added to set')},
  addBar(){const c=ui.calc,n=c.nn.trim(),w=parseFloat(String(c.nw).replace(',','.'));
    if(!n)return toast('Enter a name');if(isNaN(w)||w<0)return toast('Enter a weight');
    const b={id:'b_'+uid(),name:n,kg:+(U()==='kg'?w:w/2.20462).toFixed(3)};if(U()==='lb')b.lb=w;
    S.bars.push(b);S.barByEx[c.exId]=b.id;c.nn='';c.nw='';save();drawCalc()},
  async delBar(t){if(S.bars.length<2)return toast('Keep at least one bar');
    if(!await askConfirm('Remove this bar / machine weight?'))return;
    S.bars=S.bars.filter(b=>b.id!==t.dataset.id);save();drawCalc()},
  startEmpty(){if(S.active)return render();startWorkout([])},
  async startRoutine(t){if(S.active&&!await askConfirm('A workout is in progress. Replace it?'))return;
    const r=S.routines.find(x=>x.id===t.dataset.id);if(!r)return;
    routineRests(r.items);startWorkout(r.items.map(i=>({id:uid(),exId:i.exId,note:i.note||'',sets:routineSets(i)})),r.name);if(S.active){S.active.note=r.note||'';S.active.routineId=r.id}save();render()},
  async startPreset(t){if(S.active&&!await askConfirm('A workout is in progress. Replace it?'))return;
    const p=PRESETS.find(x=>x.id===t.dataset.id);if(!p)return;
    startWorkout(presetItems(p).map(i=>({id:uid(),exId:i.exId,sets:Array.from({length:i.sets},blank)})),p.name)},
  savePreset(t){const p=PRESETS.find(x=>x.id===t.dataset.id);if(!p)return;
    S.routines.push({id:uid(),name:p.name,items:presetItems(p).map(i=>({exId:i.exId,sets:i.sets}))});save();render();toast(p.name+' saved to your routines')},
  addEx(){openPicker(ids=>{ids.forEach(id=>S.active.items.push({id:uid(),exId:id,sets:[blank()]}));save();render()})},
  addSet(t){const it=S.active.items[+t.dataset.i];it.sets.push(blank());save();render()},
  delSet(t){const it=S.active.items[+t.dataset.i];it.sets.splice(+t.dataset.s,1);save();render()},
  async delItem(t){if(!await askConfirm('Remove this exercise from the workout?'))return;S.active.items.splice(+t.dataset.i,1);save();render()},
  moveItem(t){const a=S.active.items,i=+t.dataset.i,j=i+ +t.dataset.d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()},
  copyPrev(t){const it=S.active.items[+t.dataset.i],s=it.sets[+t.dataset.s],p=prevSets(it.exId,S.active.start)[+t.dataset.s];if(!p)return;s.w=p.w;s.r=p.r;save();render()},
  async toggleSet(t){const A=S.active,it=A.items[+t.dataset.i],s=it.sets[+t.dataset.s],ty=exById(it.exId).type;
    if(!s.done){const p=prevSets(it.exId,A.start)[+t.dataset.s];
      if(s.r===''&&p&&p.r)s.r=p.r;if(ty==='wr'&&s.w===''&&p&&p.w!=null)s.w=p.w;
      if(s.r===''||(ty==='wr'&&s.w==='')){return toast(ty==='wr'?'Enter weight and reps first':'Enter a value first')}
      const sus=suspectSet(it.exId,s,A.id);
      if(sus&&!await appDialog(sus+'\n\nIs that right?',{confirm:true,ok:'Yes, log it',cancel:'Fix it'})){save();render();return}
      s.done=true;const rest=restFor(it.exId);if(rest>0&&ty!=='time'){A.restEnd=Date.now()+rest*1000;A.restTotal=rest*1000}
      try{audio=audio||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
      if(ty==='wr'&&s.t!=='warmup')checkPR(A,it,s);
    }else{s.done=false;A.restEnd=null;A.restTotal=null;}
    save();render()},
  exRest(t){const id=t.dataset.id;S.restByEx=S.restByEx||{};S.restByEx[id]=Math.max(0,Math.min(900,restFor(id)+ +t.dataset.d));save();render()},
  exRestReset(t){if(S.restByEx)delete S.restByEx[t.dataset.id];save();render()},
  restDef(t){S.settings.rest=Math.max(0,Math.min(900,(+S.settings.rest||0)+ +t.dataset.d));save();render()},
  restMinus(){const A=S.active;if(A&&A.restEnd){A.restEnd-=15000;A.restTotal=Math.max(1000,(A.restTotal||0)-15000);save();updateRest()}},
  restPlus(){const A=S.active;if(A&&A.restEnd){A.restEnd+=15000;A.restTotal=(A.restTotal||0)+15000;save();updateRest()}},
  restSkip(){const A=S.active;if(A){A.restEnd=null;save();updateRest()}},
  async discard(){if(await askConfirm('Discard this workout? Nothing will be saved.')){S.active=null;save();render()}},

async function importText(txt){
  {try{const d=JSON.parse(txt);if(!Array.isArray(d.exercises)||!Array.isArray(d.workouts))throw 0;

    const mine=S.exercises.slice(),byId=new Map(mine.map(e=>[e.id,e])),byKey=new Map(mine.map(e=>[exerciseKey(e.name),e]));
    const idMap=new Map(),added=[];
    d.exercises.forEach(x=>{if(!x||!x.id||!x.name)return;
      const hit=byId.get(x.id)||byKey.get(exerciseKey(x.name));
      if(hit){idMap.set(x.id,hit.id);return}
      byId.set(x.id,x);byKey.set(exerciseKey(x.name),x);idMap.set(x.id,x.id);added.push(x)});
    if(!await askConfirm(`Replace workouts and routines with this backup (${d.workouts.length} workouts)?\nYour exercise list is kept${added.length?` and ${added.length} new exercises will be added`:''}.`))return;
    const remap=l=>(l||[]).forEach(w=>(w.items||[]).forEach(i=>{if(idMap.has(i.exId))i.exId=idMap.get(i.exId)}));
    remap(d.workouts);remap(d.routines);if(d.active)remap([d.active]);
    const myBars=S.bars||[],myBarByEx=S.barByEx||{};
    S=Object.assign(fresh(),d);S.exercises=[...mine,...added];
    /* bars are protected too: keep mine, add any new ones from the backup */
    S.bars=[...myBars,...(Array.isArray(d.bars)?d.bars:[]).filter(b=>b&&b.id&&!myBars.some(m=>m.id===b.id))];if(!S.bars.length)S.bars=defaultBars();
    const theirs={};Object.entries(d.barByEx||{}).forEach(([k,v])=>theirs[idMap.get(k)||k]=v);
    S.barByEx=Object.assign(theirs,myBarByEx);
    S.routines=S.routines||[];S.settings=Object.assign({unit:'kg',rest:90},d.settings);S.restByEx=S.restByEx||{};fixSetTypes();save();render();toast('Backup imported')}catch(err){toast('That is not a valid Workout Tracker backup')}}}

function parseCSV(t){const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}return rows}

  ['Triceps',/tricep|pushdown|skull/],
  ['Biceps',/bicep|curl/],
  ['Back',/pull.?up|chin.?up|pulldown|row|deadlift|traction|back extension|hyperextension|\blat\b/]];
function guessMuscle(n){n=n.toLowerCase();for(const [m,re] of MUSCLE_RULES)if(re.test(n))return m;return 'Other'}
function planHevyImport(text){
  const rows=parseCSV(text.replace(/^﻿/,'')).filter(r=>r.some(c=>c.trim()!==''));
  if(rows.length<2)throw new Error('empty');
  const head=rows.shift().map(h=>h.trim().toLowerCase());
  ['title','start_time','exercise_title'].forEach(h=>{if(head.indexOf(h)<0)throw new Error('missing '+h)});
  const g=(r,n)=>{const i=head.indexOf(n);return i<0?'':(r[i]||'').trim()};
  const wkg=r=>{const k=parseFloat(g(r,'weight_kg'));if(k>0)return k;const l=parseFloat(g(r,'weight_lbs'));return l>0?l/2.20462:0};
  const dmi=r=>{const m=parseFloat(g(r,'distance_miles'));if(m>0)return m;const k=parseFloat(g(r,'distance_km'));return k>0?+(k/1.60934).toFixed(2):0};
  const groups=new Map(),stat=new Map();
  rows.forEach(r=>{const name=g(r,'exercise_title'),st=parseHevyDate(g(r,'start_time'));if(!name||st==null)return;
    const title=g(r,'title')||'Workout',k=st+'|'+title;
    let w=groups.get(k);if(!w){w={start:st,end:parseHevyDate(g(r,'end_time')),title,rows:[]};groups.set(k,w)}w.rows.push(r);
    let x=stat.get(name.toLowerCase());if(!x){x={name,wt:0,reps:0,dur:0};stat.set(name.toLowerCase(),x)}
    if(wkg(r)>0)x.wt++;if(parseFloat(g(r,'reps'))>0)x.reps++;if(parseFloat(g(r,'duration_seconds'))>0)x.dur++});
  const byName=new Map(S.exercises.map(e=>[e.name.toLowerCase(),e])),ids=new Set(S.exercises.map(e=>e.id)),newEx=[];
  const resolve=name=>{const k=name.toLowerCase();let e=byName.get(k);if(e)return e;
    const x=stat.get(k)||{wt:0,reps:0,dur:0};
    const type=(x.reps===0&&x.dur>0)?'time':x.wt?'wr':x.reps?'reps':'wr';
    let id='h_'+slug(name);if(ids.has(id))id+='_'+uid();ids.add(id);
    e={id,name,muscle:guessMuscle(name),type,custom:true};byName.set(k,e);newEx.push(e);return e};
  const have=new Set(S.workouts.map(w=>w.id)),haveT=new Set(S.workouts.map(w=>w.start+'|'+w.name.toLowerCase()));
  const workouts=[];let dupes=0;
  groups.forEach(gp=>{const id='h_'+gp.start+'_'+slug(gp.title);
    if(have.has(id)||haveT.has(gp.start+'|'+gp.title.toLowerCase())){dupes++;return}
    const items=[];let cur=null,curName=null;
    gp.rows.forEach(r=>{const name=g(r,'exercise_title'),ex=resolve(name);
      if(!cur||curName!==name){cur={exId:ex.id,sets:[]};curName=name;items.push(cur)}
      const note=g(r,'exercise_notes');if(note&&!cur.note)cur.note=note;
      const dur=parseFloat(g(r,'duration_seconds'))||0,reps=parseFloat(g(r,'reps'))||0,dist=dmi(r);
      const set={w:+wkg(r).toFixed(3),r:ex.type==='time'?dur:reps,i:parseInt(g(r,'set_index'),10)||0};
      const ty=fixType(g(r,'set_type'));if(ty&&ty!=='normal')set.t=ty;
      if(dist>0)set.d=dist;
      cur.sets.push(set)});
    items.forEach(it=>{it.sets.sort((a,b)=>a.i-b.i);it.sets.forEach(s=>delete s.i)});
    const end=(gp.end&&gp.end>gp.start)?gp.end:gp.start+45*6e4;
    workouts.push({id,name:gp.title,start:gp.start,end,items})});
  return {workouts,newEx,dupes}}
$('#csvfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=async()=>{let plan;try{plan=planHevyImport(String(rd.result))}catch(err){return toast('That does not look like a Hevy workout CSV')}
    const {workouts,newEx,dupes}=plan;
    if(!workouts.length)return toast(dupes?`Nothing new — all ${dupes} workouts are already in the app`:'No workouts found in that file');
    const ts=workouts.map(w=>w.start),sets=workouts.reduce((a,w)=>a+w.items.reduce((b,i)=>b+i.sets.length,0),0);
    if(!await askConfirm(`Import ${workouts.length} workouts (${sets} sets) from ${fmtDateY(Math.min(...ts))} to ${fmtDateY(Math.max(...ts))}?`+(newEx.length?`\n${newEx.length} new exercises will be added to your library.`:'')+(dupes?`\n${dupes} workouts already in the app will be skipped.`:'')+'\nYour existing data is kept.'))return;
    S.exercises.push(...newEx);S.workouts.push(...workouts);cleanExerciseDuplicates();save();ui.cal=null;ui.calDay=null;ui.hv='cal';ui.tab='history';render();window.scrollTo(0,0);
    toast(`Imported ${workouts.length} workouts`)};
  rd.readAsText(f);e.target.value=''});

/* ---------- init ---------- */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();keepAwake();
/* lock to portrait where the browser allows it (installed app / fullscreen); the #rot overlay covers the rest */
const lockPortrait=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(()=>{})}catch(e){}};
lockPortrait();document.addEventListener('click',lockPortrait,{once:true});
/* ---------- Android back button: close the top-most overlay / go to Workout tab, never exit the app ---------- */
/* Android Chrome ignores history entries added without a user tap, so the guard entry is (re)added on taps too */
const guard=()=>{try{if(!(history.state&&history.state.dumbel===1))history.pushState({dumbel:1},'')}catch(e){}};
['pointerdown','touchstart','click','keydown'].forEach(ev=>document.addEventListener(ev,guard,{capture:true,passive:true}));
try{history.replaceState({dumbel:0},'');guard();
window.addEventListener('popstate',()=>{
  const dlg=$('#dialog');
  if(dlg&&!dlg.hidden){const c=$('#dialogCancel');if(c)c.click()}
  else if(!$('#pr').hidden)ACT.prClose()
  else if($('#sheet2').classList.contains('on'))sheet('',2);
  else if($('#sheet').classList.contains('on')){sheet('');render()}
  else if(ui.tab!=='workout'){ui.tab='workout';render();window.scrollTo(0,0)}
  guard()})}catch(e){}
</script>
</body>
